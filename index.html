    --line2: #3a443c; --well: #0c0f0d; --raised: #2c342e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* No pinch-zoom of the whole page: pinching is for the radar. Scrolling still works. */
html, body { touch-action: pan-x pan-y; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1900px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
h1 .logo { width: .9em; height: 1.3em; flex: none; }
h1 { display: inline-flex; align-items: center; gap: .4em; }
.head-right { display: flex; align-items: baseline; gap: 12px; }
button.help { background: none; cursor: pointer; }
button.help[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
/* Practice page: the practice config, its steps, and every command group with a Copy button (from cs_practice.cfg). */
body.page-practice .maps, body.page-practice .layout { display: none; }
.help 600 .8rem var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 3px 10px; text-decoration: none; }
.count { font-family: var(--mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.maps { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.maps button, .maps a { flex: none; text-decoration: none; font-family: var(--display); font-weight: 600; font-size: .9rem; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 6px 12px; border-radius: 3px; cursor: pointer; }
.maps button .n, .maps a .n { font-family: var(--mono); font-size: .72rem; margin-left: 6px; opacity: .8; }
.maps button[aria-pressed="true"], .maps a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.maps button.empty { opacity: .55; }

/* Filters: each row a heading (tap to fold) over a grid of equal cells, name left and count right, so the column is
   filled edge to edge and the counts line up. Difficulty (1-5) in five narrow cells. */
.filters { display: flex; flex-direction: column; }
#f-groups { display: flex; flex-direction: column; }
.filters .group { display: grid; gap: 6px; padding: 8px 0 10px; border-top: 1px solid var(--line); }
.filters .group:first-child { border-top: 0; padding-top: 0; }
.filters .group.folded { gap: 0; padding: 4px 0 0; }
.folded .fold { height: 30px; }
.filters .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 4px; }
.filters .row[style*="--cols"] { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
.fcell { min-width: 0; height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; color: var(--ink); font: 500 .84rem var(--body); text-align: left; cursor: pointer; }
.fcell .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcell .n { flex: none; font: .74rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row[style*="--cols"] .fcell { justify-content: center; padding: 0 4px; gap: 5px; }
.row[style*="--cols"] .fcell .t { flex: none; }
.fcell:hover { border-color: var(--line2); background: var(--raised); }
.fcell[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, var(--panel)); border-color: var(--accent); }
.fcell[aria-pressed="true"] .n { color: var(--accent); }
.fcell.zero { color: var(--muted); }
.fcell.zero .t, .fcell.zero .dot { opacity: .55; }
.fold { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 2px 0; color: var(--ink); cursor: pointer; text-align: left;
  font: 600 .86rem var(--body); }
.filters .fold .lbl { margin: 0; font: inherit; letter-spacing: 0; text-transform: none; color: inherit; }
.fold .chev { flex: none; color: var(--muted); transition: transform .15s; }
.fold[aria-expanded="true"] .chev { transform: rotate(90deg); }
.fold .sum { margin-left: auto; min-width: 0; font: 400 .8rem var(--body); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold.active .sum { color: var(--accent); font-weight: 500; }
.fold:hover .chev, .fold:hover .lbl { color: var(--accent); }
.filters select { width: 100%; }
/* Filters heading with "Reset all": always there (greyed out with no filter on); on a PC it stays at the top
   while the filters scroll. */
.filters-head { display: flex; align-items: center; gap: 8px; }
.filters-title { display: none; font: 600 .85rem var(--display); letter-spacing: .06em; text-transform: uppercase; }
.filters-title .n, .filters-toggle .n { font-family: var(--mono); margin-left: 6px; color: var(--accent); }
.reset { font: 500 .8rem var(--body); background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 5px 12px; border-radius: 3px; cursor: pointer; }
.reset:disabled { color: var(--muted); opacity: .5; cursor: default; }
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.group .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; }
.chip { font: 500 .82rem var(--body); border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--panel); border-color: var(--ink); }
.chip[aria-pressed="false"] { color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
select { font: 500 .82rem var(--body); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Layout: filters | radar | list or details. On wide screens three fixed columns, so the radar never moves;
   on narrow ones stacked, with the filters behind a button. */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.board { width: 100%; }
.side-right { display: grid; gap: 12px; min-width: 0; }
.filters-toggle { justify-self: start; font: 600 .85rem var(--display); letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 3px; cursor: pointer; }
.side-left { display: grid; gap: 10px; min-width: 0; }
.side-left .filters:not(.open) { display: none; }
@media (min-width: 1100px) {
  /* The radar's column is only as wide as the radar can be (it's limited by the height); spare width goes to the list. */
  /* The page fits the visible height exactly, so only the side columns scroll (one scrollbar each, none for the page).
     --map-h and --side-h are measured in measure(): the space left under the header and tabs. */
  .wrap { padding-block: 12px; gap: 12px; }
  /* Map tools a little lower than elsewhere: every pixel of height goes to the radar. */
  .center { gap: 6px; }
  .toolbar .levels { padding: 2px; }
  .toolbar .levels button, .toolbar .zoom .levels button { height: 24px; padding: 0 10px; }
  .layout { grid-template-columns: 280px minmax(0, calc(var(--map-h, calc(var(--avail-h, 100vh) - 190px)) + 44px)) minmax(360px, 1fr); }
  .center > * { max-width: var(--map-h, calc(var(--avail-h, 100vh) - 190px)); }
  .side-left, .side-right { position: sticky; top: 12px; max-height: var(--side-h, calc(var(--avail-h, 100vh) - 24px)); overflow-y: auto; scrollbar-width: thin; }
  .filters-toggle { display: none; }
  .filters-title { display: block; margin-right: auto; }
  .filters-head { position: sticky; top: 0; z-index: 1; background: var(--bg); padding-bottom: 6px; }
  .side-left .filters:not(.open) { display: flex; }
  .search input { height: 34px; }
}
@media (max-width: 1099px) {
  .search { flex: 1 1 160px; order: 0; }
  .filters-toggle { order: -1; }
  .search input { height: 44px; border-radius: 8px; font-size: 1rem; }
}

.board { position: relative; background: var(--board); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.board svg { display: block; width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; touch-action: none; }
/* Toolbar above the radar: levels and layers on the left, zoom / fullscreen / settings on the right. Nothing covers the map. */
.center { display: grid; gap: 8px; min-width: 0; justify-items: center; position: relative; }
.center > * { width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
.zoom { display: flex; gap: 4px; margin-left: auto; }
.zoom button { width: 32px; height: 30px; font: 600 1rem var(--display); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 3px; cursor: pointer; line-height: 1; display: grid; place-items: center; padding: 0; }
.zoom button:disabled { opacity: .35; cursor: default; }
.zoom .levels[hidden] { display: none; }
.zoom .levels { flex-wrap: nowrap; }
.zoom .levels button { height: 30px; width: auto; padding: 0 9px; min-width: 0; }
/* Phones: two full-width rows of equal buttons (layers; then levels and map tools), so nothing jumps around. */
@media (max-width: 699px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar > .levels, .zoom, .zoom .levels { display: flex; gap: 4px; margin: 0; }
  .toolbar > .levels button, .zoom > button, .zoom .levels button { flex: 1 1 0; width: auto; }
  .zoom { flex-wrap: wrap; }
  .zoom .levels { flex: 1 1 100%; }  /* Upper / Lower (two-level maps): a row of their own */
}
.zoom button[aria-expanded="true"], .zoom button[aria-pressed="true"] { border-color: var(--ink); }
.levels { display: flex; flex-wrap: wrap; gap: 4px; }
.levels .sep { width: 6px; }
.callout { font: 700 13px var(--display); fill: #f4f1e8; stroke: #111; stroke-width: 3px; paint-order: stroke; text-anchor: middle; dominant-baseline: central; pointer-events: none; letter-spacing: .02em; }
.callout.detail { font-weight: 600; fill: #ffd98a; }
.callout.game { fill: #9fd0ff; font-style: italic; }
.settings { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 8px; font-size: .85rem; }
.settings[hidden] { display: none; }
/* Settings drop down over the radar (top set in JS, under the toolbar), so opening them doesn't shrink the radar. */
.center > .settings { position: absolute; right: 0; z-index: 5; width: min(100%, 380px); box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
.settings .lbl { font-size: .72rem; }
.settings .row { display: flex; flex-wrap: wrap; gap: 4px; }
.spawn-pt { cursor: pointer; }
.spawn-pt circle { stroke: #111; }
.spawn-pt text { font: 700 11px var(--mono); fill: #111; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.spawn-pt.on circle { stroke: var(--ink); }
.spawn-pt.extra { opacity: .55; }
.levels button { font: 600 .75rem var(--display); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 3px 9px; border-radius: 3px; cursor: pointer; }
.levels button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .72rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); display: inline-block; }
.legend b { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }

.mk { cursor: pointer; }
.mk .path { stroke-width: calc(3px * var(--k, 1)); stroke-dasharray: calc(10px * var(--k, 1)) calc(8px * var(--k, 1)); opacity: .55; fill: none; }
.mk .from { stroke-width: calc(4px * var(--k, 1)); fill: var(--board); }
.mk .aim { stroke-width: calc(5px * var(--k, 1)); stroke-linecap: round; opacity: .85; }
.mk .land { stroke: var(--board); stroke-width: calc(4px * var(--k, 1)); }
.mk text { font: 700 17px var(--display); fill: var(--board); pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.mk.dim { opacity: .22; }
.mk.mate .path { opacity: .9; }
.partners { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.partners .lbl { font-size: .8rem; color: var(--muted); }
.partners button { font: 500 .85rem var(--body); border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 3px 10px; border-radius: 3px; cursor: pointer; text-align: left; }
.mk.sel .path { opacity: 1; stroke-width: calc(5px * var(--k, 1)); stroke-dasharray: none; }
.mk .path.cross, .mk.sel .path.cross { stroke-dasharray: calc(2px * var(--k, 1)) calc(9px * var(--k, 1)); stroke-linecap: round; }
.mk.sel .aim { stroke-width: calc(8px * var(--k, 1)); opacity: 1; }
.mk.sel .from { stroke-width: calc(6px * var(--k, 1)); }
.mk.sel .land { stroke: var(--ink); }
.mk:hover .path { opacity: 1; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel .close { justify-self: start; margin: -6px 0 -4px -6px; border: 1px solid var(--line); background: none; color: var(--muted);
  font-size: .85rem; padding: 4px 10px; border-radius: 3px; cursor: pointer; }
.panel h2 { font-family: var(--display); font-weight: 600; font-size: 1.2rem; margin: 0; line-height: 1.25; text-wrap: balance; }
.empty-state { color: var(--muted); }
.shot { width: 100%; border-radius: 3px; border: 1px solid var(--line); display: block; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .75rem; padding: 1px 8px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
.tag.side-T { color: var(--t); border-color: currentColor; }
.tag.side-CT { color: var(--ct); border-color: currentColor; }
.tag.tier { font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; margin: 0; font-size: .88rem; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.notes { margin: 0; padding-left: 18px; font-size: .92rem; max-width: 65ch; }
.notes li.lead { list-style: none; margin-left: -18px; font-weight: 500; }
.notes a, .actions a { color: var(--accent); }
.quick { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.panel { grid-template-columns: minmax(0, 1fr); }
.quick .copyfield { flex: 1 1 100%; min-width: 0; }
.quick .lbl { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 500 .82rem var(--body); border: 1px solid var(--ink); background: transparent; color: var(--ink); padding: 5px 12px; border-radius: 3px; cursor: pointer; text-decoration: none; }
.spawns { display: grid; gap: 6px; }
.spawn { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 8px; align-items: center; }
.spawn .lbl { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.setpos { font-family: var(--mono); font-size: .72rem; color: var(--muted); overflow-x: auto; white-space: nowrap; padding: 5px 8px; background: var(--bg); border-radius: 3px; border: 1px solid var(--line); display: block; }
.btn.copy { padding: 3px 10px; }
.spawns:has(.aim-shot) { gap: 14px; }
.aim-shot { grid-column: 1 / -1; width: 100%; border-radius: 3px; border: 1px solid var(--line); display: block; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-weight: 500; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }

.list h3 { font: 600 .8rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
/* Fullscreen: everything but the radar is hidden and the radar area gets exactly the visible height (--avail-h,
   measured in JS). Not position: fixed: HTML Reader shows the page in a frame that grows with the content, so
   "the screen" inside it is the page itself. Phone: details below a shorter map; PC: in a column to the right. */
body.fs header, body.fs .maps, body.fs .side-left, body.fs .side-right .list { display: none; }
body.fs .wrap { max-width: none; padding: 6px; gap: 0; }
body.fs { margin: 0; }
body.fs .layout { grid-template-columns: minmax(0, 1fr); }
body.fs .center { height: calc(var(--avail-h, 100vh) - 12px); display: flex; flex-direction: column; gap: 6px; }
body.fs .center > * { max-width: none; flex: none; }
body.fs .board { flex: 1 1 auto; min-height: 0; }
body.fs .board svg { width: 100%; height: 100%; aspect-ratio: auto; }
body.fs .side-right { display: none; }
body.fs.fs-detail .center { height: auto; }
body.fs.fs-detail .board { flex: none; height: calc((var(--avail-h, 100vh) - 12px) * .55); }
@media (min-width: 900px) {
  body.fs.fs-detail .layout { grid-template-columns: minmax(0, 1fr) 400px; }
  body.fs.fs-detail .center { height: calc(var(--avail-h, 100vh) - 12px); }
  body.fs.fs-detail .board { flex: 1 1 auto; height: auto; }
  body.fs.fs-detail .side-right { display: grid; align-content: start; position: static; height: calc(var(--avail-h, 100vh) - 12px); max-height: none; overflow-y: auto; }
}
/* Enlarged details: the selected lineup across the whole screen, for big pictures. */
.panel .bar { display: flex; justify-content: space-between; gap: 8px; }
.panel .bar .close { margin: -6px -6px -4px -6px; }
body.panel-big .panel { position: fixed; inset: 0; z-index: 80; overflow-y: auto; border: 0; border-radius: 0; align-content: start;
  padding: 16px max(16px, calc((100% - 1400px) / 2)); }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.list-head h3 { margin: 0; }
.viewsw { display: flex; gap: 4px; }
.cards { display: grid; gap: 6px; }
/* Pictures view: the aim screenshots large, one per lineup. */
.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.cards.pics { gap: 10px; }
.cards.pics .card { grid-template-columns: minmax(0, 1fr); }
.cards.pics .card img, .cards.pics .card .ph { width: 100%; height: auto; aspect-ratio: 16 / 10; }
.card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0; overflow: hidden; cursor: pointer; color: var(--ink); font: inherit;
  display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card img { width: 72px; height: 48px; object-fit: cover; display: block; background: var(--bg); }
.card .ph { width: 72px; height: 48px; background: var(--bg); }
.card .meta { padding: 6px 10px; display: grid; gap: 1px; }
.card .nm { font-weight: 600; font-size: .88rem; line-height: 1.3; }
.card .sub { font-size: .75rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.warn { font-size: .72rem; color: var(--molly); }
@media (prefers-reduced-motion: no-preference) { .mk .path, .card { transition: opacity .15s, border-color .15s; } }

/* ---- Controls (design 2026-10-14, the "Lineup Map Controls" mock-up) ----
   Primary: one filled accent button per view. Secondary: panel fill, strong outline. Quiet: text only.
   Segmented switches (layers, levels, list view), grouped icon buttons, round chips, joined copy fields. */
.help, button.help { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; font: 600 .8rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); cursor: pointer; text-decoration: none; }
button.help[aria-pressed="true"] { background: var(--raised); border-color: var(--accent); color: var(--ink); }
#theme-btn { width: 36px; padding: 0; justify-content: center; background: transparent; border-color: var(--line); color: var(--muted); }
.maps { gap: 2px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.maps button, .maps a { height: 40px; padding: 0 14px; display: inline-flex; align-items: center; background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); }
.maps button[aria-pressed="true"], .maps a[aria-current="page"] { background: transparent; color: var(--ink); border-bottom-color: var(--accent); }
.maps button[aria-pressed="true"] .n, .maps a[aria-current="page"] .n { color: var(--accent); opacity: 1; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; font: 500 .82rem var(--body); }
.chip[aria-pressed="false"] { color: var(--ink); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: var(--accent); }
.chip[aria-pressed="true"] .n { color: var(--accent); }
.reset, .quiet { height: 30px; padding: 0 4px; background: none; border: 0; color: var(--muted); font: 500 .82rem var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; }
.quiet { text-decoration: none; }
.reset:disabled { opacity: .45; text-decoration: none; }
.filters-toggle { height: 44px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; }
/* Search (2026-10-17): one field in the filters head, so it stays in reach when the filters are folded (phone) or
   scrolled (PC). Every word must match somewhere: name, note text, tags, places, status, how it's thrown. */
.filters-head { flex-wrap: wrap; }
.search { position: relative; flex: 1 1 100%; order: 3; display: flex; align-items: center; min-width: 0; }
.search .glass { position: absolute; left: 11px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; height: 36px; padding: 0 36px 0 34px; background: var(--well); border: 1px solid var(--line2); border-radius: 6px;
  color: var(--ink); font: 500 .88rem var(--body); caret-color: var(--accent); -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input::-webkit-search-cancel-button { display: none; }
.search input:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line2)); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.search.on input { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--well)); }
.search.on .glass { color: var(--accent); }
.search .slash { position: absolute; right: 9px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 5px; border: 1px solid var(--line2);
  border-radius: 4px; color: var(--muted); font: 500 .72rem var(--mono); pointer-events: none; }
.search input:focus ~ .slash, .search.on .slash { display: none; }
.search .clear { position: absolute; right: 4px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; background: none; border: 0;
  border-radius: 4px; color: var(--muted); cursor: pointer; }
.search .clear:hover { color: var(--ink); background: var(--raised); }
@media (hover: none) { .search .slash { display: none; } }
/* Why a lineup matched, when it's not in the name: a snippet of the note under the card's name. */
.linkish { height: auto; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font: inherit; }
.card .hit { font-size: .76rem; line-height: 1.35; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
mark { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--ink); border-radius: 2px; padding: 0 1px; }
/* Segmented switches */
.levels, .viewsw { display: inline-flex; flex-wrap: nowrap; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.levels:empty { display: none; }
.levels button, .viewsw .chip { height: 30px; padding: 0 14px; background: transparent; border: 0; border-radius: 5px; color: var(--muted); font: 600 .72rem var(--display); letter-spacing: .08em; text-transform: uppercase; }
.levels button[aria-pressed="true"], .viewsw .chip[aria-pressed="true"] { background: var(--raised); color: var(--ink); border: 0; }
.viewsw .chip { height: 26px; padding: 0 10px; }
.zoom { align-items: center; }
/* Buttons in panels */
.btn { height: 34px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; color: var(--ink); font: 500 .82rem var(--body); }
.btn.copy { padding: 0 12px; }
.btn.primary { height: 40px; padding: 0 18px; gap: 8px; background: var(--accent); color: var(--on-accent); border: 0; font: 700 .8rem var(--display); letter-spacing: .06em; text-transform: uppercase; justify-self: start; }
.panel .close, .panel .bar .close { height: 32px; margin: 0; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; color: var(--ink); font: 500 .82rem var(--body); }
.partners button { border-radius: 6px; }
/* Copy field: command and button joined */
.copyfield { display: flex; align-items: stretch; background: var(--well); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.copyfield code { flex: 1; min-width: 0; padding: 10px 12px; font: .8rem/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.copyfield button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; background: var(--panel); border: 0; border-left: 1px solid var(--line); color: var(--ink); font: 500 .82rem var(--body); cursor: pointer; }
.copyfield.tall { flex-direction: column; }
.copyfield.path code { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.copyfield.tall button { height: 40px; border-left: 0; border-top: 1px solid var(--line); background: var(--raised); font: 600 .78rem var(--display); letter-spacing: .06em; text-transform: uppercase; }
.copyfield.done { border-color: var(--he); }
.copyfield.done button { color: var(--he); background: color-mix(in srgb, var(--he) 14%, transparent); }
/* Practice page */
.practice { display: grid; gap: 28px 32px; align-items: start; max-width: 920px; }
.practice > div { display: grid; gap: 16px; align-content: start; min-width: 0; }
.practice h2 { font: 700 1.5rem var(--display); margin: 0; }
.practice .btn.back { grid-column: 1 / -1; justify-self: start; margin-bottom: -14px; }
.practice .sub { margin: 0; color: var(--muted); font-size: .88rem; }
.practice .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.practice .opt { display: grid; gap: 12px; align-content: start; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.practice .opt-h { margin: 0; font-weight: 600; }
.practice .opt-h b { font: 700 .85rem var(--display); color: var(--accent); margin-right: 8px; }
.practice .opt-h span { font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: 8px; }
.practice .cmds { align-items: start; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 16px; }
@media (min-width: 1200px) {
  .practice { grid-template-columns: minmax(0, 920px) minmax(300px, 440px); max-width: none; }
  .practice .cmds { grid-template-columns: minmax(0, 1fr); }
}
.practice .cmds > div { display: grid; gap: 6px; }
@media (max-width: 699px) {
  .help, button.help { height: 44px; }
  #practice-btn .label { display: none; }
  .levels button { height: 38px; }
  #theme-btn { width: 44px; }
}

/* In-game guide: a panel in the right column (like lineup details), opened from the Practice menu, that turns the
   lineups the filters show into a CS2 map guide file, with where to save it. */
/* Practice menu under the header button. Phones: across the header's width. */
header { position: relative; }
.pmenu-wrap { position: relative; }
#practice-btn .caret { color: var(--muted); margin-left: -2px; }
.pmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 330px; padding: 6px; display: grid; gap: 2px;
  background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, .35); }
.pmenu[hidden] { display: none; }
.pmenu button { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 12px; text-align: left;
  background: none; border: 0; border-radius: 6px; color: var(--ink); cursor: pointer; font: inherit; }
.pmenu button:hover, .pmenu button:focus-visible, .pmenu a:hover, .pmenu a:focus-visible { background: var(--raised); outline: none; }
/* Links to other sites (2D demo viewer: cs2d.app, 2026-10-17): set apart from the page's own views by a line, open in a new tab. */
.pmenu a { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 12px; border-radius: 6px;
  color: var(--ink); text-decoration: none; }
.pmenu a.ext { margin-top: 4px; position: relative; }
.pmenu a.ext::before { content: ""; position: absolute; left: 10px; right: 10px; top: -4px; border-top: 1px solid var(--line); }
.pmenu a > svg { color: var(--accent); margin-top: 3px; }
.pmenu .out { color: var(--muted); margin-left: 3px; vertical-align: 1px; }
.pmenu button:disabled { opacity: .5; cursor: default; background: none; }
.pmenu button > svg { color: var(--accent); margin-top: 3px; }
.pmenu b { display: block; font: 600 .9rem var(--body); }
.pmenu small { display: block; margin-top: 1px; color: var(--muted); font-size: .8rem; line-height: 1.4; }
.pmenu button[aria-current="true"] b { color: var(--accent); }
@media (max-width: 699px) {
  .head-right, .pmenu-wrap { position: static; }
  .pmenu { left: 0; right: 0; width: auto; }
  #practice-btn { width: auto; padding: 0 12px; gap: 6px; }
}
.guide .lead { margin: 0; color: var(--muted); font-size: .88rem; }
.guide .gsum { display: grid; gap: 4px; padding: 12px 14px; background: var(--well); border: 1px solid var(--line); border-radius: 6px; }
.guide .gsum .big { font: 700 1.05rem var(--display); letter-spacing: .02em; }
.guide .gsum .big span { color: var(--muted); font-weight: 600; }
.guide .gsum .from { font-size: .82rem; color: var(--muted); }
.guide .gsum .warn { font-size: .82rem; color: var(--molly); }
.guide ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; counter-reset: step; }
.guide ol > li { position: relative; padding-left: 36px; display: grid; gap: 6px; justify-items: start; counter-increment: step; }
.guide ol > li > * { margin: 0; max-width: 100%; }
.guide ol > li > .copyfield { justify-self: stretch; }
.guide ol > li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font: 700 .78rem var(--display); }
/* The folder path breaks only after a backslash, never inside a name. */
.guide .copyfield code { overflow-wrap: normal; word-break: normal; }
.guide .step-h { font-weight: 600; line-height: 24px; }
.guide .sub { margin: 0; color: var(--muted); font-size: .84rem; }
.guide .sub b { color: var(--ink); font-weight: 600; }
.guide .btn.primary { margin-top: 2px; }
.guide .btn.primary .fname { font: 600 .82rem var(--mono); letter-spacing: 0; text-transform: none; }
.guide label { font-size: .82rem; color: var(--muted); }
.guide input.gname { width: 100%; height: 38px; padding: 0 12px; background: var(--well); color: var(--ink); border: 1px solid var(--line2);
  border-radius: 6px; font: .85rem var(--mono); }
.guide input.gname:focus { outline: none; border-color: var(--accent); }
.guide kbd { font: .78rem var(--mono); padding: 1px 5px; border: 1px solid var(--line2); border-radius: 3px; background: var(--well); white-space: nowrap; }
</style>

// In-game guide: the game's map guide file ("Enable Map Guides" in Practice), made from the lineups the filters show.
// Each throw position becomes the game's three grenade nodes: where to stand, where to aim, where it lands.
// Settled in game (2026-10-15): `getpos` is the eye position (feet 64 lower, 46 crouched); the aim marker is 100 units
// in front of the eyes; a flash's `to` is where it pops, so it isn't lowered. Format: github.com/kellran/annotations.
const GAME_DIR = "C:\\Program Files (x86)\\Steam\\steamapps\\common\\Counter-Strike Global Offensive\\game\\csgo";
const GUIDE_MAX = 100;  // the game keeps 300 nodes per map offline: 100 throw positions
const GUIDE_TYPE = { smoke: "smoke", flash: "flash", molly: "molotov", he: "he", decoy: "decoy" };
const GUIDE_COLOR = { T: [255, 239, 111], CT: [151, 201, 250] };  // the game's t-yellow and ct-blue
const CLICKS = { left: "Left click", right: "Right click", "left+right": "Left + right click" };
const eyeH = l => /crouch/.test(l.movement || "") ? 46 : 64;
const guideHow = l => [CLICKS[l.click || "left"] || "", (l.movement && l.movement !== "standing") ? `${l.movement} ${l.keys || ""}`.trim() : "",
  l.throw || "throw"].filter(Boolean).join(", ");
const throwsOf = l => l.to && GUIDE_TYPE[l.util] ? l.spawns.filter(sp => sp.pos && sp.pitch != null && sp.yaw != null) : [];
function guideFile(map, list) {
  const uid = () => crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
  const vec = v => `[ ${v.map(x => x.toFixed(6)).join(", ")} ]`;
  const txt = (t, size, fin, fout) => `\n\t\t{\n\t\t\tText = "${String(t).replace(/"/g, "'")}"\n\t\t\tFontSize = ${size}\n\t\t\tFadeInDist = ${fin.toFixed(1)}\n\t\t\tFadeOutDist = ${fout.toFixed(1)}\n\t\t\tShowBackground = true\n\t\t}`;
  const node = fields => "\n\t{\n" + Object.entries(fields).map(([k, v]) => `\t\t${k} = ${typeof v === "boolean" ? v : Array.isArray(v) ? vec(v) : v}`).join("\n") + "\n\t}";
  const nodes = [];
  for (const l of list) {
    const title = l.name.split(" - ").slice(1).join(" - ") || l.name, how = guideHow(l), h = eyeH(l);
    const to = [l.to[0], l.to[1], l.util === "flash" ? l.to[2] : l.to[2] - 64];
    for (const sp of throwsOf(l)) {
      const [main, aim, dest] = [uid(), uid(), uid()];
      const feet = [sp.pos[0], sp.pos[1], sp.pos[2] - h], p = sp.pitch * Math.PI / 180, y = sp.yaw * Math.PI / 180;
      const target = [sp.pos[0] + 100 * Math.cos(p) * Math.cos(y), sp.pos[1] + 100 * Math.cos(p) * Math.sin(y), sp.pos[2] - 100 * Math.sin(p)];
      const common = { Enabled: true, Type: '"grenade"' }, align = { TextHorizontalAlign: '"center"', RevealOnSuccess: false };
      nodes.push(node({ ...common, Id: `"${main}"`, SubType: '"main"', Position: feet, Angles: [0.0, sp.yaw, 0.0], VisiblePfx: true,
        Color: `[ ${(GUIDE_COLOR[(l.side || "").toUpperCase()] || GUIDE_COLOR.T).join(", ")} ]`, TextPositionOffset: [0.0, 0.0, 60.0], TextFacePlayer: true, ...align,
        Title: txt(title, 125, 600, 40), Desc: txt([cap(sp.label || ""), how].filter(Boolean).join(", "), 75, 300, 40),
        StreakLimitGuidesOn: 2, StreakLimitGuidesOff: 2, JumpThrow: /jumpthrow/.test(l.throw || ""), GrenadeType: `"${GUIDE_TYPE[l.util]}"` }));
      nodes.push(node({ ...common, Id: `"${aim}"`, SubType: '"aim_target"', Position: target, Angles: [sp.pitch, sp.yaw, 0.0], VisiblePfx: true,
        TextPositionOffset: [0.0, 0.0, 30.0], TextFacePlayer: false, ...align, Title: txt("", 125, 50, -1), Desc: txt(how, 75, 50, -1), MasterNodeId: `"${main}"` }));
      nodes.push(node({ ...common, Id: `"${dest}"`, SubType: '"destination"', Position: to, Angles: [0.0, sp.yaw, 0.0], VisiblePfx: true,
        TextPositionOffset: [0.0, 0.0, 0.0], TextFacePlayer: false, ...align, Title: txt("", 75, 50, -1), Desc: txt("", 75, 50, -1),
        MasterNodeId: `"${main}"`, DistanceThreshold: "80.0" }));
    }
  }
  return "<!-- kv3 encoding:text:version{e21c7f3c-8a33-41c5-9977-a76d3a32aa0d} format:generic:version{7412167c-06e9-4698-aff2-e63eb59037e7} -->\n"
    + `{\n\tMapName = "de_${map}"\n\tScreenText = \n\t{\n\t}\n` + nodes.map((n, i) => `\tMapAnnotationNode${i} = ${n}`).join("\n") + "\n}\n";
}
// What goes in the guide: the list the filters show (up to GUIDE_MAX throw positions), and what's left out and why.
function guideSet(list) {
  const usable = list.filter(l => throwsOf(l).length), skipped = list.length - usable.length;
  const out = []; let spots = 0;
  for (const l of usable) { const n = throwsOf(l).length; if (spots + n > GUIDE_MAX) break; out.push(l); spots += n; }
  return { list: out, spots, skipped, cut: usable.length - out.length };
}
// The active filters in words, e.g. "T · Smoke, Flash · Tier 1, 2"; empty when none is on.
const filterWords = () => FILTERS.filter(f => state.f[f.key].size).map(f =>
  (f.key === "side" || f.key === "util" ? "" : f.label + " ") + [...state.f[f.key]].map(v => v === "" ? "not set" : f.name ? f.name(v).trim() : v).join(", ")).join(" · ");

    const [k, v] = t.dataset.set.split(":");
    state.settings[k] = v; store.set("settings", state.settings);
    if (k === "spawns" && state.spawnSel !== null && DATA.maps[state.map].spawns[state.spawnSel].priority && v === "main") state.spawnSel = null;
    return render();
  }
  if (t.dataset.layer) {
    state.layers[t.dataset.layer] = !state.layers[t.dataset.layer];
    if (!state.layers.spawns) state.spawnSel = null;
    store.set("layers", state.layers);
    return render();
  }
  if (t.dataset.spawn) { state.sel = null; state.spawnSel = state.spawnSel === +t.dataset.spawn ? null : +t.dataset.spawn; return render(); }
  if (t.dataset.map) { resetView(); state.spawnSel = null; state.guideName = ""; state.map = t.dataset.map; state.level = "default"; state.sel = null; state.f.area.clear(); }
  else if (t.dataset.fold) {
    const k = t.dataset.fold; state.fOpen.has(k) ? state.fOpen.delete(k) : state.fOpen.add(k); store.set("filtersOpen", [...state.fOpen]);
  }
  else if (t.dataset.filter) { const set = state.f[t.dataset.filter], v = t.dataset.v; set.has(v) ? set.delete(v) : set.add(v); }
  else if (t.dataset.level) state.level = t.dataset.level;
  else if (t.dataset.id) return select(+t.dataset.id, true);
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.panelBig) { state.panelBig = false; return render(); }
  if (e.key === "Escape" && !$("pmenu").hidden) return setMenu(false);
  if (e.key === "Escape" && state.guide) { state.guide = false; return render(); }
  if (e.key === "Escape") { if (state.sel !== null || state.spawnSel !== null) return deselect(); if (state.fs) { state.fs = false; return render(); } }
  const g = e.target.closest?.("g[data-id]");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(+g.dataset.id, true); }
});
$("filters-toggle").addEventListener("click", () => {
  const open = $("filters").classList.toggle("open"); $("filters-toggle").setAttribute("aria-expanded", open);
});
$("filters-reset").addEventListener("click", () => {
  FILTERS.forEach(f => state.f[f.key].clear());
  state.q = "";
  render();
});
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("q").addEventListener("keydown", e => {  // Esc empties the field, then leaves it; Enter closes the phone keyboard
  if (e.key === "Escape") { e.stopPropagation(); if (state.q) { state.q = ""; render(); } else $("q").blur(); }
  if (e.key === "Enter") $("q").blur();
});
$("q-clear").addEventListener("click", () => { state.q = ""; render(); $("q").focus(); });
document.addEventListener("keydown", e => {  // "/" jumps to the search field (PC), unless typing somewhere
  if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return;
  if (page !== "map") return;
  e.preventDefault();
  if (!$("filters").classList.contains("open") && innerWidth < 1100) $("filters-toggle").click();
  $("q").focus(); $("q").select();
});
render();
</script>
